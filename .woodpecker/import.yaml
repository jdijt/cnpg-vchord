# Import: open GitHub PRs -> Forgejo copybara/pr_<n> branches for review, via the
# centralized copybara-sync plugin. Runs on the "import-prs" cron (configure the
# schedule in the repo's Woodpecker settings). Merge an imported PR on Forgejo
# (source of truth); the export pipeline carries it back to GitHub.
when:
  - event: cron

steps:
  - name: import
    image: harbor.gw.derfniw-dev.net/homeinfra/copybara-sync:latest
    settings:
      direction: import
      github_url: https://github.com/jdijt/cnpg-vchord.git
      excludes:
        - ".woodpecker/**"
        - ".claude/**"
      forgejo_user:
        from_secret: forgejo-bot-user
      forgejo_token:
        from_secret: forgejo-bot-token # pushes copybara/pr_* branches
      app_id:
        from_secret: jdijt-repo-sync-app-id
      app_installation_id:
        from_secret: jdijt-repo-sync-installation-id
      app_private_key:
        from_secret: jdijt-repo-sync-private-key
