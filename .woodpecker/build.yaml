when:
  - event: push
    branch: main

matrix:
  PG_MAJOR: [14, 15, 16, 17, 18]   # vchord ships debs for PG 14-18 (no 13)

steps:
  - name: build-and-push
    image: harbor.gw.derfniw-dev.net/docker-proxy/woodpeckerci/plugin-kaniko
    settings:
      registry: harbor.gw.derfniw-dev.net
      repo: homeinfra/cnpg-vchord
      dockerfile: Containerfile
      build_args:
        - PG_MAJOR=${PG_MAJOR}
        - VCHORD_VERSION=1.1.1
        # Pull the base image via the Harbor docker-proxy, not Docker Hub.
        - BASE_IMAGE=harbor.gw.derfniw-dev.net/docker-proxy/library/debian:trixie-slim
      # Moving per-major tag + immutable sha-pinned tag: an analog of the GitHub
      # timestamp scheme, whose purpose is that rebuilds never move an existing tag.
      tags: 1.1.1-${PG_MAJOR}-trixie,1.1.1-${PG_MAJOR}-${CI_COMMIT_SHA}-trixie
      username:
        from_secret: harbor-user
      password:
        from_secret: harbor-key
